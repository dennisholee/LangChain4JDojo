# ──────────────────────────────────────────────────────────────────────────────
# Composable Retriever — application configuration
#
# API key lookup order:
#   1. OPENAI_API_KEY environment variable  (real OpenAI key — never store here)
#   2. openai.api-key property below        (safe for local/non-secret values)
# For LM Studio or any OpenAI-compatible local server, use the dummy value below.
# ──────────────────────────────────────────────────────────────────────────────

# API key — use 'lmstudio' (or any non-empty string) for local LM Studio.
# Leave blank to require the OPENAI_API_KEY environment variable instead.
openai.api-key=lmstudio

# OpenAI model configuration
openai.embedding.model=text-embedding-nomic-embed-text-v1.5
openai.embedding.base-url=http://localhost:1234/v1

openai.chat.model=phi-3-mini-4k-instruct
openai.chat.base-url=http://localhost:1234/v1

# Vector store (ChromaDB)
vectorstore.chroma.base-url=http://localhost:8000
vectorstore.chroma.collection=composable-retriever

# Retriever settings
retriever.max-results=3
retriever.min-score=0.0

# RAG query used in the demo
demo.query=What is composable retrieval and RAG?
